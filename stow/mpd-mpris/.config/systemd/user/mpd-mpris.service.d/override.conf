# Managed by dotfiles (stow package: mpd-mpris).
# mpd-mpris bridges MPD to the MPRIS D-Bus interface so KDE Plasma's Media
# Player widget (and playerctl) can control playback.
#
# This drop-in extends the packaged mpd-mpris.service so it:
#  - starts after MPD and talks to the local instance,
#  - restarts together with MPD (PartOf), and recovers on crash (Restart).
# Without this, `systemctl restart mpd` leaves mpd-mpris dead ("cannot poll
# mpd") and Plasma loses the media status.
[Unit]
After=mpd.service
Wants=mpd.service
PartOf=mpd.service

[Service]
Restart=on-failure
RestartSec=2
Environment=MPD_HOST=127.0.0.1
Environment=MPD_PORT=6600
