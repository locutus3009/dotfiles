# Managed by dotfiles (stow package: mpd).
# Local-only MPD for the AMD desktop, native PipeWire output.
# Runs as a per-user systemd service (systemctl --user), so it uses the
# session's PipeWire and never touches the system `mpd` user.

# --- Library ---------------------------------------------------------------
# Real path (not the ~/Music symlink) to avoid symlink-follow edge cases.
music_directory        "/hdd/locutus/Music"
# Playlists live inside the (Syncthing-synced) library so radio stations and
# saved playlists travel between machines automatically.
playlist_directory     "/hdd/locutus/Music/playlists"

# --- Runtime state (machine-specific, kept OUT of git and out of the synced
#     music tree) ----------------------------------------------------------
db_file                "~/.local/share/mpd/database"
state_file             "~/.local/share/mpd/state"
sticker_file           "~/.local/share/mpd/sticker.sql"
# No log_file -> logs go to the journal: journalctl --user -u mpd
# No pid_file -> systemd runs mpd in the foreground.

# --- Network ---------------------------------------------------------------
# Local only. Control from this desktop: mpc, Emacs/mingus, Plasma via MPRIS.
bind_to_address        "127.0.0.1"
port                   "6600"
zeroconf_enabled       "no"

# --- Behaviour -------------------------------------------------------------
auto_update            "yes"    # inotify: Syncthing-dropped tracks appear on their own
follow_inside_symlinks "yes"
restore_paused         "yes"

# --- Output ----------------------------------------------------------------
audio_output {
    type    "pipewire"
    name    "PipeWire"
}

# Silent FIFO output that feeds the ncmpcpp visualizer. It plays in parallel
# with PipeWire; nothing comes out of it audibly.
audio_output {
    type    "fifo"
    name    "Visualizer"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}

# --- Playlist plugins ------------------------------------------------------
# Needed so the existing radio playlists (.pls / .m3u with stream URLs) load.
playlist_plugin {
    name    "m3u"
    enabled "true"
}
playlist_plugin {
    name    "pls"
    enabled "true"
}
